name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'android/**'
      - 'native/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vite.native.config.ts'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build local bundle and sync Capacitor
        run: npm run android:sync && npm run native:verify
      - name: Restore debug signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-signing-v1-${{ github.repository_id }}
      - name: Prepare configured signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jingjing-release.jks"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/jingjing-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export ANDROID_VERSION_CODE=$((ANDROID_VERSION_CODE + 1000))
          ./gradlew assembleDebug
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jingjing-reading-room-1.1.0.apk
          sha256sum jingjing-reading-room-1.1.0.apk > SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jingjing-reading-room-apk
          path: |
            jingjing-reading-room-1.1.0.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "android-1.1.0-${GITHUB_RUN_NUMBER}" \
            jingjing-reading-room-1.1.0.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title '璟璟的共读小屋 Android 1.1.0' \
            --notes '可直接安装的 Android APK（调试签名）。内置小屋和阿砚素材，支持离线查看本地内容；新增刷新、重联及微信读书 API Key 重新接入。微信读书同步需要联网并配置有效 Key。'
