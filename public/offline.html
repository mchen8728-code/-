<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#eef0ec" />
    <title>共读小屋暂时离线</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef0ec;color:#233b35}body{min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));font-family:system-ui,"PingFang SC",sans-serif}.card{max-width:360px;text-align:center;padding:34px 28px;border:1px solid #d8d9d2;border-radius:24px;background:#fbf8ef;box-shadow:0 20px 55px rgba(31,49,43,.12)}img{width:112px;height:112px;object-fit:cover;object-position:left}h1{margin:10px 0 9px;font:700 25px/1.25 Georgia,"Songti SC",serif}p{margin:0;color:#6b7772;font-size:15px;line-height:1.7}button{margin-top:22px;min-height:46px;padding:0 18px;border:0;border-radius:12px;color:#fff;background:#173d36;font:700 14px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="砚猪" />
      <h1>小屋暂时离线</h1>
      <p>微信读书和 MCP 需要网络。连上网络后，砚猪会继续陪你读。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
